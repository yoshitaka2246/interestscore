[project]
name = "interest-estimation-system"
version = "0.1.0"
description = "画像特徴量と教師あり学習を用いた店頭広告に対する通行人関心度推定手法 - 研究基盤システム"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
